  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --soft: #64748b;
      --line: #dce5ef;
      --surface: rgba(255, 255, 255, 0.9);
      --paper: #f3f7fb;
      --cyan: #0891b2;
      --teal: #0f9f8f;
      --orange: #ea6a47;
      --navy: #0b1526;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(8, 145, 178, 0.11), transparent 30rem),
        radial-gradient(circle at 92% 12%, rgba(15, 159, 143, 0.09), transparent 26rem),
        var(--paper);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    .page { width: min(1540px, calc(100% - 40px)); margin: 0 auto; padding: 20px 0 70px; }
    .topbar {
      display: flex; justify-content: space-between; gap: 24px; align-items: center;
      min-height: 64px; margin-bottom: 18px;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: #111827; font-weight: 700; text-decoration: none; }
    .brand-mark {
      display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px;
      color: #67e8f9; background: var(--navy);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
    }
    .back-link {
      padding: 8px 13px; border: 1px solid #dfe6ee; border-radius: 999px;
      color: #64748b; background: #fff; font-size: 12px; text-decoration: none;
    }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.75fr);
      gap: 26px; align-items: end; padding: clamp(42px, 7vw, 88px) 0 34px;
    }
    .eyebrow { margin: 0 0 12px; color: var(--cyan); font-size: 11px; font-weight: 760; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { max-width: 900px; margin: 0; font-size: clamp(38px, 5vw, 76px); line-height: 0.98; letter-spacing: -0.055em; }
    .hero p:last-child { max-width: 760px; margin: 22px 0 0; color: var(--soft); line-height: 1.8; }
    .scope-note {
      padding: 20px; border: 1px solid rgba(8, 145, 178, 0.18); border-radius: 18px;
      background: rgba(255, 255, 255, 0.64); color: var(--soft); font-size: 13px; line-height: 1.7;
      backdrop-filter: blur(14px);
    }
    .scope-note strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .metric { min-height: 104px; padding: 18px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
    .metric span { color: var(--soft); font-size: 12px; }
    .metric strong { display: block; margin-top: 9px; font-size: 28px; font-variant-numeric: tabular-nums; }
    .filters {
      position: sticky; top: 10px; z-index: 5; display: grid;
      grid-template-columns: minmax(220px, 1.25fr) repeat(4, minmax(140px, 0.65fr));
      gap: 10px; padding: 13px; border: 1px solid rgba(220, 229, 239, 0.9);
      border-radius: 18px; background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.09); backdrop-filter: blur(18px);
    }
    .control { display: grid; gap: 6px; }
    .control label { color: var(--soft); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    input, select { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); outline: none; }
    input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1); }
    .result-bar { display: flex; justify-content: space-between; gap: 20px; padding: 25px 4px 13px; color: var(--soft); font-size: 13px; }
    .result-bar strong { color: var(--ink); }
    .history-list { display: grid; gap: 12px; }
    .history-card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(15, 23, 42, 0.045); }
    .history-card[open] { border-color: rgba(8, 145, 178, 0.28); box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08); }
    summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; padding: 18px 20px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .summary-main { min-width: 0; }
    .domain-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .domain-row strong { font-size: 15px; }
    .condition { color: var(--soft); font-size: 11px; }
    .latest-title { overflow: hidden; margin: 0; font-size: 16px; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
    .latest-description { display: -webkit-box; overflow: hidden; margin: 7px 0 0; color: var(--soft); font-size: 12px; line-height: 1.6; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .change-badges { display: flex; align-items: center; justify-content: flex-end; gap: 7px; min-width: 190px; }
    .badge { padding: 6px 9px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
    .badge.title { background: rgba(8, 145, 178, 0.1); color: #087a98; }
    .badge.description { background: rgba(234, 106, 71, 0.1); color: #c64e30; }
    .badge.stable { background: rgba(100, 116, 139, 0.09); color: var(--soft); }
    .timeline { display: grid; gap: 0; padding: 0 20px 20px; border-top: 1px solid #edf2f7; }
    .snapshot { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 18px 0 4px; }
    .snapshot + .snapshot { border-top: 1px dashed #e5ebf2; }
    .snapshot-meta { color: var(--soft); font-size: 11px; line-height: 1.8; }
    .snapshot-meta time { display: block; color: var(--ink); font-size: 12px; font-weight: 700; }
    .field { padding: 10px 12px; border-left: 3px solid transparent; border-radius: 0 10px 10px 0; background: rgba(248, 250, 252, 0.8); }
    .field + .field { margin-top: 7px; }
    .field.changed { border-left-color: var(--orange); background: rgba(255, 247, 244, 0.88); }
    .field-label { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--soft); font-size: 10px; font-weight: 760; letter-spacing: 0.08em; text-transform: uppercase; }
    .field-label em { padding: 2px 5px; border-radius: 5px; background: rgba(234, 106, 71, 0.12); color: var(--orange); font-style: normal; letter-spacing: 0; }
    .field p { margin: 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .page-link { display: inline-block; overflow: hidden; max-width: 100%; margin-top: 12px; color: var(--cyan); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
    .load-more { display: none; width: 100%; margin-top: 16px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--ink); cursor: pointer; }
    .load-more:hover { border-color: var(--cyan); color: var(--cyan); }
    .empty { padding: 80px 20px; border: 1px dashed var(--line); border-radius: 18px; color: var(--soft); text-align: center; }
    .loading { padding: 90px 20px; color: var(--soft); text-align: center; }
    .footer { padding-top: 42px; color: var(--soft); font-size: 12px; text-align: center; }
    @media (max-width: 1050px) {
      .hero { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .control:first-child { grid-column: 1 / -1; }
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 24px, 1540px); }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .control:first-child { grid-column: 1 / -1; }
      summary { grid-template-columns: 1fr; }
      .change-badges { justify-content: flex-start; min-width: 0; }
      .snapshot { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">&lt;/&gt;</span>
        <span>前端AI实验室</span>
      </a>
      <a class="back-link" href="index.html">← 返回实验室首页</a>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">SERP Metadata Timeline</p>
        <h1>Title 与 Description 历史</h1>
        <p>追踪页面在搜索结果中的标题和描述变化，快速确认哪一天发生调整、哪些关键词和国家受到影响。</p>
      </div>
      <aside class="scope-note">
        <strong>对比口径</strong>
        仅比较相同关键词、相同国家和相同页面 URL 的相邻可见记录。这里的 Description 来自搜索结果摘要，不等同于网页源代码中的 Meta Description。
      </aside>
    </section>

    <section class="metrics" id="meta-metrics" aria-label="文案变化概览"></section>
    <section class="filters" aria-label="文案历史筛选">
      <div class="control">
        <label for="meta-search">搜索页面或文案</label>
        <input id="meta-search" type="search" placeholder="输入域名、URL、Title 或 Description">
      </div>
      <div class="control">
        <label for="meta-status">变化类型</label>
        <select id="meta-status">
          <option value="changed" selected>全部变化</option>
          <option value="title">Title 变化</option>
          <option value="description">Description 变化</option>
          <option value="both">两者均变化</option>
          <option value="stable">暂无变化</option>
          <option value="all">全部记录</option>
        </select>
      </div>
      <div class="control"><label for="meta-keyword">关键词</label><select id="meta-keyword"></select></div>
      <div class="control"><label for="meta-country">国家</label><select id="meta-country"></select></div>
      <div class="control"><label for="meta-domain">网站</label><select id="meta-domain"></select></div>
    </section>

    <div class="result-bar"><span id="meta-result-count">正在读取数据</span><span id="meta-date-range"></span></div>
    <section class="history-list" id="meta-history-list" aria-live="polite"><div class="loading">正在整理 Title 与 Description 时间线…</div></section>
    <button class="load-more" id="meta-load-more" type="button">加载更多</button>
    <footer class="footer">前端AI实验室 · Copyright © pzl</footer>
  </main>

  <script>
    (async () => {
      const response = await fetch('data/meta-history.json?v=7a4902065724');
      if (!response.ok) throw new Error('文案历史数据请求失败：HTTP ' + response.status);
      const data = await response.json();
      const list = document.getElementById('meta-history-list');
      const searchInput = document.getElementById('meta-search');
      const statusSelect = document.getElementById('meta-status');
      const keywordSelect = document.getElementById('meta-keyword');
      const countrySelect = document.getElementById('meta-country');
      const domainSelect = document.getElementById('meta-domain');
      const loadMoreButton = document.getElementById('meta-load-more');
      const countryNames = { in: '印度', us: '美国', gb: '英国', ca: '加拿大', br: '巴西', fr: '法国', ph: '菲律宾', mx: '墨西哥' };
      const pageSize = 30;
      let visibleCount = pageSize;
      let filteredItems = [];

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function appendOptions(select, values, formatter) {
        select.replaceChildren();
        values.forEach((value) => {
          const option = createElement('option', '', formatter(value));
          option.value = value;
          select.appendChild(option);
        });
      }
      appendOptions(keywordSelect, ['all', ...data.keywords], (value) => value === 'all' ? 'All' : value);
      appendOptions(countrySelect, ['all', ...data.countries], (value) => value === 'all' ? 'All' : countryNames[value] ?? value.toUpperCase());
      appendOptions(domainSelect, ['all', ...data.domains], (value) => value === 'all' ? 'All' : value);

      function matchesStatus(item, status) {
        const titleChanged = item.titleChangeCount > 0;
        const descriptionChanged = item.descriptionChangeCount > 0;
        if (status === 'changed') return titleChanged || descriptionChanged;
        if (status === 'title') return titleChanged;
        if (status === 'description') return descriptionChanged;
        if (status === 'both') return titleChanged && descriptionChanged;
        if (status === 'stable') return !titleChanged && !descriptionChanged;
        return true;
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLocaleLowerCase();
        filteredItems = data.histories.filter((item) => {
          const latest = item.snapshots.at(-1);
          const searchable = [item.domain, item.url, latest?.title, latest?.description]
            .join(' ')
            .toLocaleLowerCase();
          return matchesStatus(item, statusSelect.value) &&
            (keywordSelect.value === 'all' || item.keyword === keywordSelect.value) &&
            (countrySelect.value === 'all' || item.country === countrySelect.value) &&
            (domainSelect.value === 'all' || item.domain === domainSelect.value) &&
            (!query || searchable.includes(query));
        });
        visibleCount = pageSize;
        render();
      }

      function createBadge(className, text) {
        return createElement('span', 'badge ' + className, text);
      }

      function renderSnapshot(snapshot) {
        const row = createElement('article', 'snapshot');
        const meta = createElement('div', 'snapshot-meta');
        const date = createElement('time', '', snapshot.date);
        date.dateTime = snapshot.date;
        meta.append(date, createElement('span', '', '自然排名：第 ' + snapshot.position + ' 名'));
        const fields = createElement('div');
        [
          { label: 'Title', value: snapshot.title || '暂无标题', changed: snapshot.titleChanged },
          { label: 'Description', value: snapshot.description || '暂无描述', changed: snapshot.descriptionChanged }
        ].forEach((item) => {
          const field = createElement('div', 'field' + (item.changed ? ' changed' : ''));
          const label = createElement('div', 'field-label', item.label);
          if (item.changed) label.appendChild(createElement('em', '', '本次变化'));
          field.append(label, createElement('p', '', item.value));
          fields.appendChild(field);
        });
        row.append(meta, fields);
        return row;
      }

      function renderCard(item, index) {
        const latest = item.snapshots.at(-1);
        const card = createElement('details', 'history-card');
        if (index < 2) card.open = true;
        const header = document.createElement('summary');
        const main = createElement('div', 'summary-main');
        const domainRow = createElement('div', 'domain-row');
        domainRow.append(
          createElement('strong', '', item.domain),
          createElement('span', 'condition', item.keyword + ' · ' + (countryNames[item.country] ?? item.country.toUpperCase()))
        );
        main.append(
          domainRow,
          createElement('p', 'latest-title', latest?.title || '暂无标题'),
          createElement('p', 'latest-description', latest?.description || '暂无描述')
        );
        const badges = createElement('div', 'change-badges');
        if (item.titleChangeCount > 0) badges.appendChild(createBadge('title', 'Title ' + item.titleChangeCount + ' 次'));
        if (item.descriptionChangeCount > 0) badges.appendChild(createBadge('description', 'Description ' + item.descriptionChangeCount + ' 次'));
        if (item.titleChangeCount === 0 && item.descriptionChangeCount === 0) badges.appendChild(createBadge('stable', '暂无变化'));
        header.append(main, badges);
        const timeline = createElement('div', 'timeline');
        [...item.snapshots].reverse().forEach((snapshot) => timeline.appendChild(renderSnapshot(snapshot)));
        const link = createElement('a', 'page-link', item.url + ' ↗');
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        timeline.appendChild(link);
        card.append(header, timeline);
        return card;
      }

      function renderMetrics() {
        const changedItems = data.histories.filter((item) => item.titleChangeCount > 0 || item.descriptionChangeCount > 0);
        const metrics = [
          ['监测页面条件', data.histories.length],
          ['Title 变化', data.histories.reduce((total, item) => total + item.titleChangeCount, 0)],
          ['Description 变化', data.histories.reduce((total, item) => total + item.descriptionChangeCount, 0)],
          ['受影响网站', new Set(changedItems.map((item) => item.domain)).size]
        ];
        const container = document.getElementById('meta-metrics');
        metrics.forEach(([label, value]) => {
          const card = createElement('article', 'metric');
          card.append(createElement('span', '', label), createElement('strong', '', value));
          container.appendChild(card);
        });
      }

      function render() {
        list.replaceChildren();
        const visibleItems = filteredItems.slice(0, visibleCount);
        if (visibleItems.length === 0) {
          list.appendChild(createElement('div', 'empty', '当前筛选条件下没有匹配的文案历史'));
        } else {
          visibleItems.forEach((item, index) => list.appendChild(renderCard(item, index)));
        }
        const resultCount = document.getElementById('meta-result-count');
        resultCount.replaceChildren(
          '找到 ',
          createElement('strong', '', filteredItems.length),
          ' 条页面条件历史'
        );
        loadMoreButton.style.display = visibleCount < filteredItems.length ? 'block' : 'none';
      }

      [statusSelect, keywordSelect, countrySelect, domainSelect].forEach((select) =>
        select.addEventListener('change', applyFilters)
      );
      searchInput.addEventListener('input', applyFilters);
      loadMoreButton.addEventListener('click', () => {
        visibleCount += pageSize;
        render();
      });
      document.getElementById('meta-date-range').textContent =
        data.dates.length === 0 ? '暂无数据日期' : data.dates[0] + ' → ' + data.dates.at(-1);
      renderMetrics();
      applyFilters();
    })().catch((error) => {
      const list = document.getElementById('meta-history-list');
      list.replaceChildren();
      list.appendChild(document.createTextNode('文案历史加载失败：' + error.message));
      console.error(error);
    });
  </script>
</body>
</html>
