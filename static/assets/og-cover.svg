    <path d="M38 76H392M38 142H392M38 208H392" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M42 220C92 194 118 202 158 155s83-25 118-72 73 5 112-35" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <g fill="#67e8f9">
      <circle cx="42" cy="220" r="7"/><circle cx="158" cy="155" r="7"/><circle cx="276" cy="83" r="7"/><circle cx="388" cy="48" r="7"/>
