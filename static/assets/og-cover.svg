    <path d="M28 20 16 34l12 14M40 20l12 14-12 14M38 15 30 53" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="29" fill="#ffffff" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">前端AI实验室</text>
    <text x="88" y="57" fill="#a8b7cc" font-size="16" font-family="Arial, sans-serif" letter-spacing="3">FRONTEND INTELLIGENCE</text>
  </g>
  <text x="72" y="260" fill="#ffffff" font-size="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="750">关键词排名趋势</text>
  <text x="72" y="330" fill="#ffffff" font-size="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="750">与前端数据工具</text>
  <text x="76" y="388" fill="#a8b7cc" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif">从搜索排名变化中，看见网站增长信号</text>
  <g transform="translate(692 190)">
